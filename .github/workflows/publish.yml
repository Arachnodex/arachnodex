name: Publish packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package release scope
        required: true
        default: all-pending
        type: choice
        options:
          - all-pending
          - "@arachnodex/bot-protection-heuristics"
          - "@arachnodex/core"
          - "@arachnodex/create"
          - "@arachnodex/job-csp-report"
          - "@arachnodex/job-link-issues"
          - "@arachnodex/job-nfa-report"
          - "@arachnodex/job-sitemap"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.16.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install npm
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Validate packages
        run: npm run check

      - name: Publish packages
        env:
          RELEASE_SCOPE: ${{ inputs.package }}
        run: |
          package_directories=(
            packages/bot-protection-heuristics
            packages/core
            packages/job-csp-report
            packages/job-link-issues
            packages/job-nfa-report
            packages/job-sitemap
            packages/create
          )

          published=0

          for package_directory in "${package_directories[@]}"; do
            package_name=$(node -p "require('./${package_directory}/package.json').name")
            package_version=$(node -p "require('./${package_directory}/package.json').version")

            if [[ "$RELEASE_SCOPE" != "all-pending" && "$RELEASE_SCOPE" != "$package_name" ]]; then
              continue
            fi

            if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
              echo "Skipping ${package_name}@${package_version}: already published."
              continue
            fi

            npm publish --workspace "$package_name"
            published=$((published + 1))
          done

          echo "Published ${published} package(s)."
